[package]
name = "netterm"
description = "Tauri shell of netterm: a thin adapter over netterm-core."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "netterm_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
netterm-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { workspace = true }
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }

# Watching a session window's page for its death (#89): the same versions
# Tauri's webview uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
