# The lab the containerlab device suite expects (docs/dev/containerlab.md).
# Deploy it on the containerlab server yourself:
#
#   docker build -t enodix-frr:latest lab/frr
#   ENODIX_LAB_PASSWORD=... sudo -E containerlab deploy -t lab/enodix-test.clab.yml
#
# Deployed and passing with these images (docs/dev/containerlab.md).
# cEOS must be imported into Docker first (Arista's download needs an account).
name: enodix-test

mgmt:
  network: enodix-test-mgmt
  ipv4-subnet: 172.20.30.0/24

topology:
  nodes:
    srl1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:24.10.1
      type: ixr-d2l
      mgmt-ipv4: 172.20.30.11
      # Partial config, applied on top of the image's default (its admin
      # login is unchanged).
      startup-config: configs/srl1.cli

    ceos1:
      kind: arista_ceos
      image: ceos:4.36.0.1F
      mgmt-ipv4: 172.20.30.12
      # Containerlab's defaults plus telnet (admin / admin).
      startup-config: configs/ceos1.cfg
      # Telnet is published on the containerlab server itself, because the
      # app does not tunnel telnet through a jump host: the suite reaches
      # it at <server>:2323 (`telnet_address` in the lab file).
      ports:
        - 2323:23

    frr1:
      kind: linux
      image: enodix-frr:latest
      mgmt-ipv4: 172.20.30.13
      binds:
        - configs/frr1/daemons:/etc/frr/daemons
        - configs/frr1/frr.conf:/etc/frr/frr.conf
      env:
        # The container's root password for SSH; taken from the environment
        # of `containerlab deploy`, never written here.
        ENODIX_LAB_PASSWORD: ${ENODIX_LAB_PASSWORD}

    # Cisco IOS-XE (the `ios` platform), a vrnetlab VM image built from the
    # CSR 1000v qcow2 (Cisco's download needs an account). Its default
    # login (admin / admin, privilege 15) is unchanged.
    csr1:
      kind: cisco_csr1000v
      image: vrnetlab/cisco_csr1000v:17.03.08
      mgmt-ipv4: 172.20.30.14

    # Juniper cJunos Evolved (the `junos` platform), imported from
    # Juniper's free download. Its default login is unchanged.
    cjunos1:
      kind: juniper_cjunosevolved
      image: cjunosevolved:25.4R1.13-EVO
      mgmt-ipv4: 172.20.30.15
      env:
        CPTX_COSIM: "BX"

  links:
    - endpoints: ["srl1:e1-1", "ceos1:eth1"]
    - endpoints: ["ceos1:eth2", "frr1:eth1"]
    - endpoints: ["frr1:eth2", "srl1:e1-2"]
