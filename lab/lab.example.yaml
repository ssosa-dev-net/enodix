# The containerlab device suite's lab file (docs/containerlab.md).
#
# Copy this file to lab/lab.yaml (ignored by git) or anywhere else and point
# NETTERM_LAB_CONFIG at it. Do not commit the copy. Prefer `password_env`
# (the name of an environment variable holding the password) over writing a
# password here.

# Seconds to wait for each answer from a device (default 30).
timeout: 30

# The containerlab server, used as an SSH jump host to reach the devices'
# management addresses. Leave it out if this computer reaches them directly.
# It logs in with the keys of this computer's SSH agent (the Windows OpenSSH
# agent or Pageant) unless `key_file` (+ `passphrase_env`) or
# `password_env` is given.
jump_host:
  address: 192.0.2.10 # replace with your containerlab server
  port: 22
  username: root # the user you log in to the server as

# The devices of lab/netterm-test.clab.yml (their fixed management addresses).
# `platform` sets the defaults of each check (srlinux, ceos, frr, vtysh,
# ios, nxos, junos, other); every one can be overridden here: username,
# prompt, setup, command, expect, large_command, large_min_bytes,
# size_command, size_output, exit, telnet (true or a port), login_prompt,
# password_prompt, login_banner and motd (the banner texts the device
# shows, as in lab/configs/ceos1.cfg and csr1-banner.cfg), and for the
# built-in platform checks definition (the built-in platform jobs drive
# it with; "" for none), paging_command,
# privilege_check + privilege_expect, config_end, enable_secret_env, and
# checks (the only checks made on the entry, by the names the suite
# prints). A device logs in with `password_env` (default
# NETTERM_LAB_PASSWORD), or `agent: true`.
devices:
  - name: srl1
    platform: srlinux
    address: 172.20.30.11
    password_env: NETTERM_LAB_SRL_PASSWORD

  - name: ceos1
    platform: ceos
    address: 172.20.30.12
    password_env: NETTERM_LAB_CEOS_PASSWORD
    # The topology publishes cEOS's telnet on the server's port 2323;
    # telnet is not tunnelled through the jump host, so it goes there
    # directly.
    telnet: 2323
    telnet_address: 192.0.2.10 # replace with your containerlab server
    # The banner of lab/configs/ceos1.cfg.
    login_banner: &ceos_banner |
      =================================================================
        NETTERM LAB - ceos1 (Arista EOS) - authorised users only
        Report problems in the lab channel #
        Contact: Network Operations <noc@example.net>
        The word Password: in this banner is not a question.
      =================================================================

  - name: frr1
    platform: frr
    address: 172.20.30.13
    # No password_env: NETTERM_LAB_PASSWORD, which the topology also gives
    # the container as its root password.

  # The same FRR container as its `vtysh` user, whose login shell is vtysh:
  # FRR as a router's CLI, which the built-in `frr` platform drives.
  - name: frr1-vtysh
    platform: vtysh
    address: 172.20.30.13

  # Cisco IOS-XE (CSR 1000v): the image's own login, admin / admin.
  - name: csr1
    platform: ios
    address: 172.20.30.14
    password_env: NETTERM_LAB_CSR_PASSWORD
    # lab/configs/csr1-banner.cfg, pasted after each deploy.
    login_banner: &csr_banner |
      ******************************************************************
        NETTERM LAB - csr1 (IOS-XE) - authorised users only
        All sessions are logged. Questions go to the NOC queue #
        Contact: Network Operations <noc@example.net>
        Never type your Password: into a chat window or a ticket.
      ******************************************************************
    motd: &csr_motd |
      == csr1 maintenance notice ==
      Quote the change ticket as CHG#
      On call: lab engineer <oncall@example.net>
      Your Password: does not expire in this lab.
      == end of notice ==

  # Juniper cJunos Evolved: the image's own login (see containerlab's
  # juniper_cjunosevolved documentation).
  - name: cjunos1
    platform: junos
    address: 172.20.30.15
    password_env: NETTERM_LAB_JUNOS_PASSWORD

  # A second login to cEOS and to the CSR 1000v, at privilege 1, where
  # `enable` asks for a password: the privileged mode check answers it with
  # `enable_secret` and sees a wrong one refused, and the other job checks
  # run from the unprivileged prompt. The login and the secret are the lab's
  # own (lab/configs/ceos1.cfg, lab/configs/csr1-privilege.cfg). `checks`
  # names the only checks made on an entry: the rest need privilege 15 in
  # a terminal, which the app never asks for there.
  - name: ceos1-enable
    platform: ceos
    address: 172.20.30.12
    username: labuser
    password: labuser
    enable_secret: netterm-enable
    login_banner: *ceos_banner
    checks: &enable_checks
      - privileged mode
      - paging off
      - config backup
      - second channel and backup on login

  - name: csr1-enable
    platform: ios
    address: 172.20.30.14
    username: labuser
    password: labuser
    enable_secret: netterm-enable
    login_banner: *csr_banner
    motd: *csr_motd
    checks: *enable_checks

  # Cisco NX-OS (n9kv) is not in the topology (no image on the lab server
  # yet); with one, add a node and:
  # - name: nxos1
  #   platform: nxos
  #   address: 172.20.30.16
  #   password_env: NETTERM_LAB_NXOS_PASSWORD
