! Paste into csr1 after each deploy (configure terminal), then `write memory`.
! The topology gives the CSR 1000v no startup config of its own.
!
! IOS-XE has no SFTP server: files move by SCP only, which is off by
! default ("Administratively disabled."). The account needs privilege 15
! (the image's admin has it); privilege 1 gets "Privilege denied.".
ip scp server enable
! Uploads go about five times faster with it (0.7 to 3.5 MB/s in the lab).
ip ssh bulk-mode
