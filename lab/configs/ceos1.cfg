! Startup config of ceos1 in the containerlab device suite's lab.
! Containerlab's own cEOS defaults (admin login, SSH, management VRF-less
! Management0) plus telnet, which the suite checks through the port the
! topology publishes on the containerlab server, and eAPI over HTTPS on
! port 443, which the tunnel ports check calls through the jump host.
hostname ceos1
!
! A login banner, awkward on purpose as real ones often are: several lines,
! a line ending in "#", one ending in ">", the word "Password:" inside a
! sentence. EOS shows it before the login (the SSH authentication banner,
! and before "login:" on telnet). The lab file's `login_banner` of ceos1
! must say the same lines (the login banner check, docs/containerlab.md).
banner login
=================================================================
  NETTERM LAB - ceos1 (Arista EOS) - authorised users only
  Report problems in the lab channel #
  Contact: Network Operations <noc@example.net>
  The word Password: in this banner is not a question.
=================================================================
EOF
!
username admin privilege 15 role network-admin secret admin
! A second login at privilege 1, and an enable password: `enable` asks
! "Password: " there, which the suite's privileged mode check answers with
! the profile's enable secret (#113). The admin login is not asked.
username labuser privilege 1 secret labuser
enable password netterm-enable
!
aaa authorization exec default local
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
management api http-commands
   protocol https
   no shutdown
!
management ssh
   idle-timeout 0
!
management telnet
   no shutdown
!
interface Management0
   ip address 172.20.30.12/24
!
interface Ethernet1
   description to srl1 e1-1
   no switchport
   ip address 10.0.12.2/30
!
interface Ethernet2
   description to frr1 eth1
   no switchport
   ip address 10.0.23.1/30
!
ip routing
!
ip route 0.0.0.0/0 172.20.30.1
!
end
