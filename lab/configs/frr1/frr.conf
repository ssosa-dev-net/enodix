frr defaults traditional
hostname frr1
service integrated-vtysh-config
!
interface eth1
 description to ceos1 eth2
 ip address 10.0.23.2/30
exit
!
interface eth2
 description to srl1 e1-2
 ip address 10.0.31.1/30
exit
!
interface lo
 ip address 192.168.255.3/32
exit
!
router ospf
 ospf router-id 192.168.255.3
 network 10.0.23.0/30 area 0
 network 10.0.31.0/30 area 0
 network 192.168.255.3/32 area 0
exit
!
