! Paste into csr1 after each deploy (configure terminal), then `write memory`.
! The topology gives the CSR 1000v no startup config of its own.
!
! A second login at privilege 1, and an enable secret: `enable` asks
! "Password: " there, which the suite's privileged mode check answers with
! the profile's enable secret (#113). The image's admin login is privilege
! 15 and is not asked.
username labuser privilege 1 secret labuser
enable secret netterm-enable
