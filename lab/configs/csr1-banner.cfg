! Paste into csr1 after each deploy (configure terminal), then `write memory`.
! The topology gives the CSR 1000v no startup config of its own.
!
! A login banner (IOS-XE sends it as the SSH authentication banner) and a
! message of the day (shown in the shell after the login, as ordinary
! output). Both are awkward on purpose, as real ones often are: several
! lines, a line ending in "#", a line ending in ">", the word "Password:"
! inside a sentence. The lab file's `login_banner` and `motd` of csr1 must
! say the same lines (the login banner check, docs/containerlab.md).
! The text ends at the "~" delimiter, so no comment may follow inside it.
banner login ~
******************************************************************
  NETTERM LAB - csr1 (IOS-XE) - authorised users only
  All sessions are logged. Questions go to the NOC queue #
  Contact: Network Operations <noc@example.net>
  Never type your Password: into a chat window or a ticket.
******************************************************************
~
banner motd ~
== csr1 maintenance notice ==
Quote the change ticket as CHG#
On call: lab engineer <oncall@example.net>
Your Password: does not expire in this lab.
== end of notice ==
~
