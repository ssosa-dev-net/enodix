[package]
name = "netterm-cli"
description = "The headless binary of netterm: the core from the command line, with no window."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "netterm-cli"
path = "src/main.rs"
test = false

[dependencies]
netterm-core = { path = "../core" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
