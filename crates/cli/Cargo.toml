[package]
name = "netterm-cli"
description = "The headless binary of netterm: the core from the command line, with no window."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "netterm-cli"
path = "src/main.rs"
test = false

[dependencies]
netterm-core = { path = "../core" }
rpassword = "7"
serde = "1"
serde_json = "1"
tokio = { workspace = true }
zeroize = "1"

# Whether there is a console to ask for the master password on.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
portable-pty = "0.9.0"
# A jump host for the tunnel tests.
russh = { workspace = true }
tempfile = "3"
tokio = { workspace = true }

# A process without a controlling terminal, for the "no terminal" checks.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[build-dependencies]
serde_json = "1"
