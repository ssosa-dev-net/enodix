[package]
name = "enodix-cli"
description = "The headless binary of enodix: the core from the command line, with no window."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "enodix-cli"
path = "src/main.rs"
test = false

[dependencies]
enodix-core = { path = "../core" }
rpassword = "7"
serde = "1"
serde_json = "1"
tokio = { workspace = true }
zeroize = "1"

# Whether there is a console to ask for the master password on, on a
# window station someone sees.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_StationsAndDesktops", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
portable-pty = "0.9.0"
# A jump host for the tunnel tests.
russh = { workspace = true }
tempfile = "3"
tokio = { workspace = true }

# A process without a controlling terminal, for the "no terminal" checks.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# A process on a window station nobody sees (tests/no_desktop.rs); the
# sweep of leftover test entries in Credential Manager (the core's
# tests/support/keychain.rs).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Credentials", "Win32_System_StationsAndDesktops", "Win32_System_Threading"] }

[build-dependencies]
serde_json = "1"

# The program's version details on Windows (the crate Tauri uses for the
# app's), and the VC++ runtime linked in, as Tauri does for the app: a clean
# Windows has no vcruntime140.dll (#139).
[target.'cfg(windows)'.build-dependencies]
static_vcruntime = "3"
tauri-winres = "0.3"
