[package]
name = "netterm-core"
description = "UI-free core of netterm: all behaviour lives here."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# The vault: its key from the master password (Argon2id), its body sealed
# with XChaCha20-Poly1305, a checksum to tell damage from a wrong password,
# and its key and contents wiped from memory when dropped.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
sha2 = "0.11"
zeroize = "1"
# Local time, for naming session logs after when they started.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# File system notifications, for reloading on external changes (git pull).
notify = "8"
# Highlight rules' patterns.
regex = "1"
# The update check's one request (the release manifest). The same reqwest and
# rustls (`ring` provider, the system's certificate store, the system proxy)
# as tauri-plugin-updater, so there is one TLS stack and no extra build tools.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
# Pinned exactly: the russh API changes roughly monthly (see docs/spec-v1.md).
# `ring` backend (no extra native build tooling on Windows); `des` and `dsa`
# compile in the legacy algorithms, `rsa` the RSA host/user keys.
russh = { version = "=0.65.1", default-features = false, features = ["ring", "rsa", "des", "dsa", "flate2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Comparing the running version with the latest release's.
semver = "1"
serde = { version = "1", features = ["derive"] }
# Credential profiles as stored in the keychain.
serde_json = "1"
# YAML for workspace files; maintained fork of the deprecated serde_yaml.
serde_norway = "0.9"
serialport = "4"
thiserror = "2"
tokio = { workspace = true }
# Checking web links before they are opened (http and https only).
url = "2"
# Workspace identifiers (random, so that two workspaces never share one).
uuid = { version = "1", features = ["v4"] }

# The Windows keychain (Credential Manager) for credential profiles.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading"] }

# Ending a Python process with the processes it started (its process group).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Streams of connections for the in-process SSH agent (tests/support).
futures = "0.3"
rand = { version = "0.10", features = ["thread_rng"] }
tempfile = "3"

# The in-process stand-in for Pageant needs Pageant's pipe name.
[target.'cfg(windows)'.dev-dependencies]
sha2 = "0.11"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
