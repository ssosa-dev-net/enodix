Show version: show version
BGP summary: show ip bgp summary
OSPF neighbours: show ip ospf neighbor
Interface detail: show interface {{interface}}
Route to a prefix: show ip route {{prefix}}
Interface description: |-
  configure terminal
  interface {{interface}}
  description {{description}}
  end

Save the configuration:
  answer:
    "Destination filename": ""
  stop:
    - "% Invalid input"
  steps:
    - copy running-config startup-config
    - show startup-config | include hostname
