[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.90"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util"] }
# Pinned exactly: the russh API changes roughly monthly (see docs/spec-v1.md).
# `ring` backend (no extra native build tooling on Windows); `des` and `dsa`
# compile in the legacy algorithms, `rsa` the RSA host/user keys. The core
# uses it; the headless binary's tests run a jump host with it.
russh = { version = "=0.65.1", default-features = false, features = ["ring", "rsa", "des", "dsa", "flate2"] }
# SFTP over an SSH channel (the Files tab, file transfers). Pinned exactly
# beside russh: it runs over a channel stream, so the two move together.
russh-sftp = "=3.0.1"

# Argon2 unoptimised takes many seconds per vault unlock; tests and dev
# builds use it optimised.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# An upload's hashes are computed as it is read; unoptimised, they would be
# slower than the transfer.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.md5]
opt-level = 3
