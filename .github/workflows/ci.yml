# Runs the checks a change must pass before it is merged (CONTRIBUTING.md):
# `npm run check` (format check, clippy, svelte-check, every Rust test) and
# `npm run test:python` (the Python bridge against the headless binary), on
# Linux and on Windows. The smoke test, the containerlab suite and the
# installer checks need a desktop, a lab or Windows Sandbox and stay local
# (docs/dev/releasing.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: CI only reads the code. Nothing is published from here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Smaller, faster debug builds on a runner that starts empty each time.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Linux packages (Tauri's WebKitGTK, libudev for serial ports)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libudev-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev

      - name: Rust (stable, with clippy and rustfmt)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install JavaScript dependencies
        run: npm ci

      # Tauri's build reads the built interface (frontendDist, ../dist).
      - name: Build the interface
        run: npm run build

      # `npm run check`'s three parts, the tests with --no-fail-fast so that
      # one failing test file does not hide the others.
      - name: Format check
        run: npm run format:check

      - name: Lint (clippy, svelte-check)
        run: npm run lint

      - name: Tests
        run: cargo test --workspace --no-fail-fast

      # The cache restores target/, and with it a virtual environment from an
      # earlier run that may not work on this runner (pip half there): the
      # tests then make a fresh one.
      - name: Remove a cached Python environment
        shell: bash
        run: rm -rf target/python-test

      - name: Python bridge tests
        run: npm run test:python
        env:
          ENODIX_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
