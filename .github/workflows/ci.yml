# Runs the checks a change must pass before it is merged (CONTRIBUTING.md):
# `npm run check` (format check, clippy, svelte-check, the interface tests,
# every Rust test) and
# `npm run test:python` (the Python bridge against the headless binary), on
# Linux and on Windows. The containerlab suite and the installer checks
# need a lab or Windows Sandbox and stay local (docs/dev/releasing.md); the
# smoke test has a job of its own below.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: CI only reads the code. Nothing is published from here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Smaller, faster debug builds on a runner that starts empty each time.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Linux packages (Tauri's WebKitGTK, libudev for serial ports)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libudev-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev

      - name: Rust (stable, with clippy and rustfmt)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install JavaScript dependencies
        run: npm ci

      # Tauri's build reads the built interface (frontendDist, ../dist).
      - name: Build the interface
        run: npm run build

      # `npm run check`'s parts, the Rust tests with --no-fail-fast so that
      # one failing test file does not hide the others.
      - name: Format check
        run: npm run format:check

      - name: Lint (clippy, svelte-check)
        run: npm run lint

      - name: Interface tests (vitest)
        run: npm run test:ui

      - name: Tests
        run: cargo test --workspace --no-fail-fast

      # The cache restores target/, and with it a virtual environment from an
      # earlier run that may not work on this runner (pip half there): the
      # tests then make a fresh one.
      - name: Remove a cached Python environment
        shell: bash
        run: rm -rf target/python-test

      - name: Python bridge tests
        run: npm run test:python
        env:
          ENODIX_TEST_PYTHON: ${{ steps.python.outputs.python-path }}

  # The end-to-end smoke test (scripts/smoke.mjs, docs/agents/areas/testing.md):
  # builds the app and drives its real windows through WebView2's DevTools
  # port. A job of its own, so that its name is a stable required check and
  # the Windows runner's cache is not shared with `check`. It runs on the
  # runner's own desktop (an interactive, unlocked session: the clipboard
  # works there, so no step is skipped; a desktop made by run-on-desktop.py
  # does not work on the runner, WebView2 cannot make its window there). The
  # release workflow refuses a tag whose commit has no passing run of this
  # job.
  smoke:
    name: Smoke test (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.12"

      # Both programs are built in debug and release profiles of their own;
      # the cache keeps target/ keyed on the lock file, so a run that
      # changed no dependency compiles only the workspace's own crates.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: smoke

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build the app (release, no installer)
        run: npm run app:build

      - name: Build the test SSH server
        run: cargo build -p enodix-core --example test_ssh_server

      # WebView2 150 and later ignores WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS in
      # an elevated process, and the runner's user is an administrator:
      # SMOKE_WEBVIEW2_POLICY makes the test also write its arguments to the
      # machine's WebView2 policy (as in Windows Sandbox).
      - name: Smoke test
        shell: bash
        run: node scripts/smoke.mjs 2>&1 | tee target/smoke.log
        env:
          SMOKE_TEST_SERVER: target/debug/examples/test_ssh_server.exe
          SMOKE_PYTHON: ${{ steps.python.outputs.python-path }}
          SMOKE_WEBVIEW2_POLICY: "1"
          SMOKE_SCREENSHOTS: ${{ github.workspace }}/target/smoke-pictures
          SMOKE_NET_LOGS: ${{ github.workspace }}/target/smoke-net-logs

      - name: Keep the log and the pictures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-failure
          path: |
            target/smoke.log
            target/smoke-pictures
            target/smoke-net-logs
          if-no-files-found: warn
          retention-days: 14
