name: Probe
on:
  pull_request:
    paths: [".github/workflows/probe.yml", "scripts/ci-probe.ps1"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: powershell -NoProfile -File scripts/ci-probe.ps1
