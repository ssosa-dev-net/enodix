# Keeps credit for an AI tool out of main. Fails a pull request whose
# description carries a Claude Co-Authored-By line (a squash merge can copy
# the description into the commit), or that has a commit with a Claude
# co-author, author or committer. A "Generated by/with Claude Code" footer
# line in the description is dropped silently: the PR tooling adds it on its
# own and re-adds it on edits, so it never fails the check.
# Runs again when the description is edited.
# Make "Attribution" a required check in the main ruleset so a failure blocks
# the merge.
name: Attribution

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Read-only: the check only reads the pull request and its commits.
permissions:
  contents: read

concurrency:
  group: attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  attribution:
    name: Attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The description and SHAs come in through env, never written into the
      # script itself, so nothing in a pull request can run as shell.
      - name: Check the description and commits
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          fail() { echo "::error::$1"; failed=1; }

          # Matches "Claude", "Claude Code" and "claude[bot]", or Anthropic's
          # noreply address.
          claude_name='^claude([ [].*)?$'
          claude_email='^noreply@anthropic\.com$'
          coauthor='^[[:space:]]*co-authored-by:.*(claude|noreply@anthropic\.com)'
          # The footer is its own line ("_Generated by [Claude Code](...)_",
          # "🤖 Generated with ..."), so only match it at the start of a line:
          # a sentence that mentions the phrase is fine. The footer is not a
          # failure: it is removed from the description before the other checks
          # look at it. (grep -v exits 1 when nothing is left, so || true.)
          footer='^[^[:alnum:]]*generated[[:space:]]+(by|with)[^[:alnum:]]+claude[[:space:]]+code'
          body=$(printf '%s\n' "$PR_BODY" | grep -Eiv "$footer" || true)

          if printf '%s\n' "$body" | grep -Eiq "$coauthor"; then
            fail 'Description: remove the Claude Co-Authored-By line.'
          fi

          while IFS=$'\x1f' read -r sha an ae cn ce; do
            short=${sha:0:7}
            if printf '%s' "$an" | grep -Eiq "$claude_name" || printf '%s' "$ae" | grep -Eiq "$claude_email"; then
              fail "Commit $short: authored by $an <$ae>."
            fi
            if printf '%s' "$cn" | grep -Eiq "$claude_name" || printf '%s' "$ce" | grep -Eiq "$claude_email"; then
              fail "Commit $short: committed by $cn <$ce>."
            fi
            if git log -1 --format=%B "$sha" | grep -Eiq "$coauthor"; then
              fail "Commit $short: has a Claude Co-Authored-By line."
            fi
          done < <(git log --format='%H%x1f%an%x1f%ae%x1f%cn%x1f%ce' "$BASE_SHA..$HEAD_SHA")

          if [ "$failed" -ne 0 ]; then
            echo "Attribution check failed: see the errors above."
            exit 1
          fi
          echo "No Claude credit in the description or commits."
